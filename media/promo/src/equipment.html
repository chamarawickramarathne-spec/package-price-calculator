<!doctype html>
<html>
<head><meta charset="utf-8"><link rel="stylesheet" href="base.css"></head>
<body>
<div class="screen">
  <div class="statusbar">
    <span>9:41</span>
    <span class="icons"><span>&#128246;</span><span>&#128268;</span><span>&#128267;&#65039;</span></span>
  </div>

  <div class="topappbar">
    <div class="iconbtn"><svg viewBox="0 0 24 24"><path d="M3 6h18v2H3V6zm0 5h18v2H3v-2zm0 5h18v2H3v-2z"/></svg></div>
    <h1>New Package</h1>
  </div>

  <div class="tabrow">
    <div class="tab">Details</div>
    <div class="tab active">Equipment</div>
    <div class="tab">Labor &amp; Profit</div>
    <div class="tab">Pricing</div>
  </div>

  <div class="content">
    <div class="card">
      <h2>Equipment</h2>
      <button class="btn btn-filled" style="align-self:flex-start">
        <svg viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
        Add equipment
      </button>
      <div class="hr"></div>

      <div class="eqrow">
        <div class="info">
          <div class="name">Sony A7 IV Camera</div>
          <div class="each">Rs. 15,000.00 each</div>
          <div class="line-total">Rs. 30,000.00</div>
        </div>
        <div class="stepper"><div class="rnd">&minus;</div><div class="qty">2</div><div class="rnd">+</div></div>
        <div class="del">&#128465;&#65039;</div>
      </div>
      <div class="hr"></div>

      <div class="eqrow">
        <div class="info">
          <div class="name">Godox Lighting Kit</div>
          <div class="each">Rs. 8,500.00 each</div>
          <div class="line-total">Rs. 8,500.00</div>
        </div>
        <div class="stepper"><div class="rnd">&minus;</div><div class="qty">1</div><div class="rnd">+</div></div>
        <div class="del">&#128465;&#65039;</div>
      </div>
      <div class="hr"></div>

      <div class="eqrow">
        <div class="info">
          <div class="name">Zoom H6 Audio Recorder</div>
          <div class="each">Rs. 3,200.00 each</div>
          <div class="line-total">Rs. 3,200.00</div>
        </div>
        <div class="stepper"><div class="rnd">&minus;</div><div class="qty">1</div><div class="rnd">+</div></div>
        <div class="del">&#128465;&#65039;</div>
      </div>
      <div class="hr"></div>
    </div>
  </div>

  <div class="bottombar">
    <div>
      <div class="label">Final Total</div>
      <div class="total">Rs. 81,400.00</div>
    </div>
    <div style="display:flex; gap:8px;">
      <button class="btn" style="color:#B5371F; background:transparent;">Back</button>
      <button class="btn btn-filled">Next</button>
    </div>
  </div>
  <div class="navpill"></div>
</div>
</body>
</html>
