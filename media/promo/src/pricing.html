<!doctype html>
<html>
<head><meta charset="utf-8"><link rel="stylesheet" href="base.css"></head>
<body>
<div class="screen">
  <div class="statusbar">
    <span>9:41</span>
    <span class="icons"><span>&#128246;</span><span>&#128268;</span><span>&#128267;&#65039;</span></span>
  </div>

  <div class="topappbar">
    <div class="iconbtn"><svg viewBox="0 0 24 24"><path d="M3 6h18v2H3V6zm0 5h18v2H3v-2zm0 5h18v2H3v-2z"/></svg></div>
    <h1>New Package</h1>
  </div>

  <div class="tabrow">
    <div class="tab">Details</div>
    <div class="tab">Equipment</div>
    <div class="tab">Labor &amp; Profit</div>
    <div class="tab active">Pricing</div>
  </div>

  <div class="content">
    <div class="card">
      <h2>Price breakdown</h2>
      <div class="brow"><span class="l">Equipment</span><span class="v">Rs. 41,700.00</span></div>
      <div class="brow"><span class="l">Labor</span><span class="v">Rs. 21,000.00</span></div>
      <div class="brow"><span class="l">Additional costs</span><span class="v">Rs. 11,300.00</span></div>
      <div class="brow"><span class="l">Subtotal</span><span class="v">Rs. 74,000.00</span></div>
      <div class="brow"><span class="l">Profit</span><span class="v">Rs. 7,400.00</span></div>
      <div class="hr"></div>
      <div class="brow final"><span>Final Total</span><span class="v">Rs. 81,400.00</span></div>
    </div>

    <div class="card">
      <h2>Invoice</h2>
      <button class="btn btn-tonal">
        <svg viewBox="0 0 24 24"><path d="M20 2H8a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V4a2 2 0 0 0-2-2zm-8.5 7.5v4l3.5-2-3.5-2zM20 16H8v2h12v-2z"/></svg>
        Save PDF invoice
      </button>
      <button class="btn btn-outline">
        <svg viewBox="0 0 24 24"><path d="M18 16.08a2.9 2.9 0 0 0-1.96.77L8.91 12.7a3.3 3.3 0 0 0 0-1.4l7.05-4.11A3 3 0 1 0 15 5a3.1 3.1 0 0 0 .1 1L8.05 10.1a3 3 0 1 0 0 3.8l7.12 4.16c-.05.31-.1.58-.1.84a2.92 2.92 0 1 0 2.92-2.92z"/></svg>
        Share PDF invoice
      </button>
    </div>
  </div>

  <div class="bottombar">
    <div>
      <div class="label">Final Total</div>
      <div class="total">Rs. 81,400.00</div>
    </div>
    <div style="display:flex; gap:8px;">
      <button class="btn" style="color:#B5371F; background:transparent;">Back</button>
      <button class="btn btn-filled">Save</button>
    </div>
  </div>
  <div class="navpill"></div>
</div>
</body>
</html>
